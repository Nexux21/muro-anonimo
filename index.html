<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muro Anónimo - Confesiones & Historias</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.25);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased custom-scrollbar">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass-card border-b border-gray-800">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-sky-500/20">
          <i class="fa-solid fa-user-secret"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white leading-tight">Muro Anónimo</h1>
          <p class="text-xs text-sky-400 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            En vivo • Confesiones en tiempo real
          </p>
        </div>
      </div>
      
      <button id="openPublishModalBtn" class="bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-semibold px-4 py-2 rounded-xl text-sm transition-all duration-200 shadow-md shadow-sky-500/20 flex items-center gap-2">
        <i class="fa-solid fa-pen-nib"></i>
        <span>Publicar</span>
      </button>
    </div>
  </header>

  <!-- Content Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6">
    
    <!-- Hero / Banner -->
    <div class="glass-card rounded-2xl p-6 mb-6 text-center relative overflow-hidden">
      <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-sky-500/10 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -left-10 -top-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
      
      <h2 class="text-2xl font-bold text-white mb-2">Expresa lo que nunca dijiste</h2>
      <p class="text-gray-400 text-sm max-width-md mx-auto mb-4">
        Un espacio 100% anónimo para compartir tus secretos, historias, arrepentimientos o pensamientos sin juzgar.
      </p>

      <!-- Category Filter Pills -->
      <div class="flex flex-wrap items-center justify-center gap-2 pt-2" id="categoryFilters">
        <button data-cat="todos" class="cat-pill active bg-sky-500/20 text-sky-300 border border-sky-500/40 px-3 py-1 rounded-full text-xs font-medium transition-all">Todos</button>
        <button data-cat="Amor" class="cat-pill bg-gray-800/80 text-gray-400 hover:text-gray-200 border border-gray-700/50 px-3 py-1 rounded-full text-xs font-medium transition-all">❤️ Amor</button>
        <button data-cat="Secreto" class="cat-pill bg-gray-800/80 text-gray-400 hover:text-gray-200 border border-gray-700/50 px-3 py-1 rounded-full text-xs font-medium transition-all">🤫 Secreto</button>
        <button data-cat="Trabajo" class="cat-pill bg-gray-800/80 text-gray-400 hover:text-gray-200 border border-gray-700/50 px-3 py-1 rounded-full text-xs font-medium transition-all">💼 Trabajo</button>
        <button data-cat="Familiar" class="cat-pill bg-gray-800/80 text-gray-400 hover:text-gray-200 border border-gray-700/50 px-3 py-1 rounded-full text-xs font-medium transition-all">🏠 Familiar</button>
        <button data-cat="Vergonzoso" class="cat-pill bg-gray-800/80 text-gray-400 hover:text-gray-200 border border-gray-700/50 px-3 py-1 rounded-full text-xs font-medium transition-all">😳 Vergonzoso</button>
        <button data-cat="Desahogo" class="cat-pill bg-gray-800/80 text-gray-400 hover:text-gray-200 border border-gray-700/50 px-3 py-1 rounded-full text-xs font-medium transition-all">🌧️ Desahogo</button>
      </div>
    </div>

    <!-- Feed Container -->
    <div id="postsFeed" class="space-y-4">
      <!-- Loading Skeleton -->
      <div class="glass-card rounded-2xl p-5 animate-pulse space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-gray-800"></div>
            <div class="h-4 w-28 bg-gray-800 rounded"></div>
          </div>
          <div class="h-3 w-16 bg-gray-800 rounded"></div>
        </div>
        <div class="h-4 w-3/4 bg-gray-800 rounded"></div>
        <div class="h-4 w-1/2 bg-gray-800 rounded"></div>
      </div>
    </div>

  </main>

  <!-- Publish Modal -->
  <div id="publishModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
    <div class="glass-card w-full max-w-lg rounded-2xl p-6 relative border border-gray-700/60 shadow-2xl transform scale-95 transition-transform duration-200" id="modalContainer">
      <button id="closePublishModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-800">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-feather text-sky-400"></i>
        Escribir Confesión
      </h3>

      <form id="confessionForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Categoría</label>
          <select id="postCategory" class="w-full bg-gray-900/90 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-sky-500">
            <option value="Secreto">🤫 Secreto</option>
            <option value="Amor">❤️ Amor</option>
            <option value="Trabajo">💼 Trabajo</option>
            <option value="Familiar">🏠 Familiar</option>
            <option value="Vergonzoso">😳 Vergonzoso</option>
            <option value="Desahogo">🌧️ Desahogo</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Tu Secreto o Historia</label>
          <textarea id="postContent" rows="5" required maxlength="1000" placeholder="Cuenta tu historia libremente..." class="w-full bg-gray-900/90 border border-gray-700 rounded-xl p-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-sky-500 resize-none custom-scrollbar"></textarea>
          <div class="flex justify-end mt-1">
            <span id="charCounter" class="text-xs text-gray-500">0 / 1000</span>
          </div>
        </div>

        <div class="flex items-center justify-between pt-2">
          <span class="text-xs text-gray-400 flex items-center gap-1">
            <i class="fa-solid fa-shield-halved text-emerald-400"></i>
            100% Anónimo
          </span>
          <button type="submit" id="submitBtn" class="bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition-all shadow-md shadow-sky-500/20 flex items-center gap-2">
            <span>Publicar</span>
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 glass-card border border-sky-500/30 px-4 py-3 rounded-xl shadow-xl text-sm text-sky-200 flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMessage">¡Publicado correctamente!</span>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Credenciales de Firebase de tu proyecto (muro-anomino)
    const firebaseConfig = {
      apiKey: "AIzaSyBAmZLBucqjAfJlsj-J6I8o6j4y6Tlk2f0",
      authDomain: "muro-anomino.firebaseapp.com",
      projectId: "muro-anomino",
      storageBucket: "muro-anomino.firebasestorage.app",
      messagingSenderId: "49271248505",
      appId: "1:49271248505:web:df50ef9f97eeccce4126a8",
      measurementId: "G-LHKVZ3JHKC"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const confessionsRef = collection(db, "confessions");

    // Elementos DOM
    const postsFeed = document.getElementById("postsFeed");
    const confessionForm = document.getElementById("confessionForm");
    const postContent = document.getElementById("postContent");
    const postCategory = document.getElementById("postCategory");
    const charCounter = document.getElementById("charCounter");
    const publishModal = document.getElementById("publishModal");
    const modalContainer = document.getElementById("modalContainer");
    const openPublishModalBtn = document.getElementById("openPublishModalBtn");
    const closePublishModalBtn = document.getElementById("closePublishModalBtn");
    const submitBtn = document.getElementById("submitBtn");

    let activeFilter = "todos";
    let allPosts = [];

    // Nombres y Avatares Anónimos Aleatorios
    const anonymousAvatars = [
      { name: "Sombra Misteriosa", color: "from-purple-500 to-indigo-600", icon: "fa-ghost" },
      { name: "Pensador Nocturno", color: "from-blue-500 to-cyan-600", icon: "fa-moon" },
      { name: "Alma Anónima", color: "from-emerald-500 to-teal-600", icon: "fa-mask" },
      { name: "Viajero Silencioso", color: "from-amber-500 to-orange-600", icon: "fa-user-secret" },
      { name: "Corazón Oculto", color: "from-rose-500 to-pink-600", icon: "fa-heart" }
    ];

    function getRandomAvatar() {
      return anonymousAvatars[Math.floor(Math.random() * anonymousAvatars.length)];
    }

    // Modal Handlers
    function openModal() {
      publishModal.classList.remove("hidden");
      setTimeout(() => {
        publishModal.classList.remove("opacity-0");
        modalContainer.classList.remove("scale-95");
      }, 10);
    }

    function closeModal() {
      publishModal.classList.add("opacity-0");
      modalContainer.classList.add("scale-95");
      setTimeout(() => {
        publishModal.classList.add("hidden");
        confessionForm.reset();
        charCounter.textContent = "0 / 1000";
      }, 200);
    }

    openPublishModalBtn.addEventListener("click", openModal);
    closePublishModalBtn.addEventListener("click", closeModal);
    publishModal.addEventListener("click", (e) => {
      if (e.target === publishModal) closeModal();
    });

    // Contador de caracteres
    postContent.addEventListener("input", (e) => {
      charCounter.textContent = `${e.target.value.length} / 1000`;
    });

    // Toast Notification
    function showToast(message) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMessage").textContent = message;
      toast.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 3000);
    }

    // Guardar publicación en Firestore
    confessionForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = postContent.value.trim();
      const category = postCategory.value;

      if (!content) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Publicando...</span>`;

      try {
        const avatar = getRandomAvatar();
        await addDoc(confessionsRef, {
          content: content,
          category: category,
          authorName: avatar.name,
          authorColor: avatar.color,
          authorIcon: avatar.icon,
          likes: 0,
          createdAt: serverTimestamp()
        });

        closeModal();
        showToast("¡Tu confesión ha sido publicada!");
      } catch (error) {
        console.error("Error al publicar:", error);
        showToast("Ocurrió un problema al publicar.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Publicar</span><i class="fa-solid fa-paper-plane text-xs"></i>`;
      }
    });

    // Cargar publicaciones en Tiempo Real desde Firebase
    const q = query(confessionsRef, orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      allPosts = snapshot.docs.map(docSnap => ({
        id: docSnap.id,
        ...docSnap.data()
      }));
      renderPosts();
    }, (error) => {
      console.error("Error al sincronizar datos:", error);
      postsFeed.innerHTML = `
        <div class="glass-card rounded-2xl p-6 text-center text-red-400">
          <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
          <p>No se pudo conectar a la base de datos. Verifica la configuración de Firebase.</p>
        </div>
      `;
    });

    // Renderizar publicaciones en el DOM
    function renderPosts() {
      const filtered = activeFilter === "todos" 
        ? allPosts 
        : allPosts.filter(p => p.category === activeFilter);

      if (filtered.length === 0) {
        postsFeed.innerHTML = `
          <div class="glass-card rounded-2xl p-8 text-center text-gray-400">
            <i class="fa-solid fa-comment-slash text-3xl mb-3 text-sky-400/50"></i>
            <p class="font-medium text-white">No hay confesiones en esta categoría aún.</p>
            <p class="text-xs text-gray-500 mt-1">¡Sé la primera persona en compartir algo!</p>
          </div>
        `;
        return;
      }

      postsFeed.innerHTML = filtered.map(post => {
        const dateStr = post.createdAt?.toDate 
          ? post.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          : 'Hace un momento';

        return `
          <div class="glass-card rounded-2xl p-5 hover:border-gray-700/80 transition-all duration-200">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr ${post.authorColor || 'from-sky-500 to-indigo-600'} flex items-center justify-center text-white text-sm shadow-md">
                  <i class="fa-solid ${post.authorIcon || 'fa-user-secret'}"></i>
                </div>
                <div>
                  <h4 class="font-bold text-sm text-gray-200">${post.authorName || 'Anónimo'}</h4>
                  <span class="text-[10px] text-gray-500">${dateStr}</span>
                </div>
              </div>
              <span class="bg-sky-500/10 text-sky-400 border border-sky-500/20 px-2.5 py-0.5 rounded-full text-xs font-medium">
                ${post.category || 'Secreto'}
              </span>
            </div>

            <p class="text-gray-200 text-sm leading-relaxed mb-4 whitespace-pre-line">${escapeHTML(post.content)}</p>

            <div class="flex items-center justify-between pt-2 border-t border-gray-800/60 text-xs text-gray-400">
              <button onclick="likePost('${post.id}')" class="flex items-center gap-1.5 hover:text-rose-400 transition-colors py-1 px-2.5 rounded-lg hover:bg-rose-500/10">
                <i class="fa-regular fa-heart text-rose-500"></i>
                <span class="font-medium text-gray-300">${post.likes || 0}</span>
              </button>
              
              <button onclick="copyPost('${escapeHTML(post.content)}')" class="hover:text-sky-400 transition-colors py-1 px-2.5 rounded-lg hover:bg-sky-500/10 flex items-center gap-1">
                <i class="fa-regular fa-copy"></i>
                <span>Copiar</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Sanitizar texto HTML
    function escapeHTML(str) {
      return str ? str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      ) : '';
    }

    // Dar Like en tiempo real
    window.likePost = async (id) => {
      try {
        const postDoc = doc(db, "confessions", id);
        await updateDoc(postDoc, {
          likes: increment(1)
        });
      } catch (err) {
        console.error("Error al dar like:", err);
      }
    };

    // Copiar contenido
    window.copyPost = (text) => {
      navigator.clipboard.writeText(text);
      showToast("Texto copiado al portapapeles");
    };

    // Filtros por categoría
    document.getElementById("categoryFilters").addEventListener("click", (e) => {
      const btn = e.target.closest(".cat-pill");
      if (!btn) return;

      document.querySelectorAll(".cat-pill").forEach(b => {
        b.className = "cat-pill bg-gray-800/80 text-gray-400 hover:text-gray-200 border border-gray-700/50 px-3 py-1 rounded-full text-xs font-medium transition-all";
      });

      btn.className = "cat-pill active bg-sky-500/20 text-sky-300 border border-sky-500/40 px-3 py-1 rounded-full text-xs font-medium transition-all";
      activeFilter = btn.dataset.cat;
      renderPosts();
    });
  </script>
</body>
</html>
